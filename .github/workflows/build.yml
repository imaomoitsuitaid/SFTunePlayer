name: build

# Push to main:
#   - builds the Windows installer (SFTunePlayer-Setup.exe) and macOS VST3/AU
#   - if no release exists yet for the number in VERSION, publishes release v<VERSION>
#     (the plugin's update check looks at the latest release)
# Other branches / manual runs: build only.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $V"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSFTP_VERSION=${{ needs.version.outputs.version }} -DSFTP_GITHUB_REPO=${{ github.repository }}

      - name: Build
        run: cmake --build build --config Release --parallel --target SFTunePlayer_VST3 SFTunePlayer_Standalone

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DBuildDir=$PWD\build\SFTunePlayer_artefacts\Release" installer\SFTunePlayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: SFTunePlayer-Windows
          path: dist/SFTunePlayer-Setup.exe

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G Xcode -DSFTP_VERSION=${{ needs.version.outputs.version }} -DSFTP_GITHUB_REPO=${{ github.repository }}
      - run: cmake --build build --config Release --target SFTunePlayer_VST3 SFTunePlayer_AU -- -quiet
      - name: Zip
        run: |
          cd build/SFTunePlayer_artefacts/Release
          ditto -c -k --keepParent "VST3/SF Tune Player.vst3" "$GITHUB_WORKSPACE/SFTunePlayer-macOS-VST3.zip"
          ditto -c -k --keepParent "AU/SF Tune Player.component" "$GITHUB_WORKSPACE/SFTunePlayer-macOS-AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SFTunePlayer-macOS
          path: SFTunePlayer-macOS-*.zip

  release:
    needs: [version, windows, macos]
    if: needs.version.outputs.publish == 'true' && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SF Tune Player ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: out/*
